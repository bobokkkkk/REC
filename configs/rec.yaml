paths:
  extra_data_root: ""
  ffpp: ""
  cdfv2: ""
  dfdcp: ""
  dfd: ""
  wild: ""

model:
  dim_in: 768
  dim_hidden: 768

epochs: 30
batch_size: 16
num_workers: 8
image_size: [224, 224]

augment:
  hflip_p: 0.5
  brightness: 0.1
  contrast: 0.1
  saturation: 0.1

optimizer:
  global_weight_decay: 0.003

  clip_model:
    lr: 8.0e-7
    weight_decay: 2.0e-4

  unet1:
    lr: 6.0e-5
    weight_decay: 8.0e-3

  classifier:
    lr: 8.0e-5
    weight_decay: 6.0e-3

  feature_filter:
    lr: 3.0e-5
    weight_decay: 5.0e-3

  layer_fusion:
    lr: 2.5e-5
    weight_decay: 5.0e-3

  fusion_weights:
    lr: 1.5e-5
    weight_decay: 5.0e-3

  feature_fusion_projection:
    lr: 1.5e-5
    weight_decay: 5.0e-3

  crop_feature_extractor:
    lr: 2.0e-5
    weight_decay: 5.0e-3
